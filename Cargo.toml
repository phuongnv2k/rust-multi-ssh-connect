[package]
name = "rust-multi-ssh-connect"
version = "0.1.0"
edition = "2021"
description = "Minimalist, multi-profile concurrent SSH, Terminal, SFTP, and Port Forwarding manager"

[dependencies]
tao = "0.30"
wry = "0.47"
tokio = { version = "1", features = ["full"] }
russh = "0.49"
russh-keys = "0.49"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
rfd = "0.15"
anyhow = "1"
tracing-subscriber = "0.3"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
data-encoding = "2"
